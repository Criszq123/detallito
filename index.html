<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un Detallito Especial 🐾</title>

  <!-- Tipografías de Google Fonts: Estilo doodle + cuerpo limpio -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Quicksand:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- Hojas de estilo modulares -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ========================================================
       FILTROS SVG PARA EFECTO YOSHI'S ISLAND (TRAZO TEMBLOROSO)
       ======================================================== -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" version="1.1"
    xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="yoshi-boil" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise">
          <animate attributeName="seed" from="1" to="35" dur="0.9s" step="1" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <!-- Contenedor dinámico de corazoncitos y destellos flotantes -->
  <div id="particles-container"></div>

  <!-- Botón flotante para pausar/activar música -->
  <button id="music-toggle" class="music-toggle" title="Controlar música" aria-label="Controlar música">
    🎵
  </button>

  <!-- ========================================================
       PANTALLA DE INICIO (OVERLAY DE BIENVENIDA)
       ======================================================== -->
  <div id="welcome-overlay" class="welcome-overlay">
    <div class="welcome-box">
      <img id="welcome-cat" class="welcome-cat yoshi-stroke gentle-float" src="img/cat-glasses.png"
        alt="Gatito saludando">
      <h1 id="welcome-title" class="welcome-title">Tengo un detallito para ti...</h1>
      <p id="welcome-hint" class="welcome-hint">Sube el volumen y toca para comenzar 🐾</p>
      <button id="welcome-btn" class="btn btn-primary btn-pulse">Abrir mensaje 💌</button>
    </div>
  </div>

  <!-- ========================================================
       TARJETA PRINCIPAL DEL CUENTO
       ======================================================== -->
  <main class="story-wrapper">
    <section class="story-card">

      <!-- Indicador de avance por escena -->
      <div id="progress-bar" class="progress-bar"></div>

      <!-- Escenario con el gatito y su sombra -->
      <div class="stage">
        <div id="cat-container" class="cat-container" title="¡Tócame para un mimo!">
          <img id="cat-image" class="cat-image yoshi-stroke squash-in" src="img/cat-glasses.png"
            alt="Ilustración del gatito">
          <div id="cat-shadow" class="cat-shadow"></div>
        </div>
      </div>

      <!-- Cuadro de texto y diálogo -->
      <div class="story-dialogue">
        <p id="story-text" class="story-text text-appear">Cargando detallito...</p>
        <p id="story-subtext" class="story-subtext"></p>
      </div>

      <!-- Botones de navegación -->
      <div class="controls">
        <button id="btn-prev" class="btn btn-secondary" style="display: none;" title="Escena anterior">
          ← Atrás
        </button>
        <button id="btn-next" class="btn btn-primary" title="Avanzar escena">
          Continuar 🐾
        </button>
      </div>

    </section>
  </main>

  <!-- Lógica modular en JavaScript -->
  <script type="module" src="js/main.js"></script>
</body>

</html>
